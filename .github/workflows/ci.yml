name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-perf-tooling:
    name: Python performance tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - run: python -m unittest discover -s tests/tooling -p 'test_python_perf*.py' -v
      - run: python -m unittest discover -s bench -p 'test_report_host_delta.py' -v

  # The shared CI of the socle: make check on the three release targets and
  # the conventions drift, from the declarations in maelys-release.conf. Its
  # sanitizers and fuzz jobs run in parallel on Linux with clang and
  # libclang-rt: ASan/UBSan over the whole native inventory in the SMALL
  # profile (LARGE has its own job below: the ASan build of the inventory
  # is the longest step of this file, so one profile per job), and the
  # libFuzzer smoke over the committed corpus. The AFL++ smoke stays below:
  # it needs afl++ and a core-pattern change.
  check:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@ecb0a665d39cdf47fa2400fc573d8a555f2d6470 # v0.60.0
    with:
      product: maelys-datalog
      sanitizer_command: make -j4 -f Makefile.asan asan
      fuzz_command: make -f Makefile.fuzz fuzz-smoke

  # One job per concern, so that the wall time of a run is the longest
  # concern and not their sum: a release waits for this file three times
  # (the fix, the release pull request, the merge commit the tag goes on).
  native-tests:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run native test suite
        run: make -j4 test

      - name: Run every native test in LARGE
        run: make -j4 test BUILD_DIR=build/native-large CFLAGS='-Wall -Wextra -g -I. -Iinclude -DMAELYS_DATALOG_PROFILE_LARGE'

      - name: Check module boundaries
        run: bash tools/check_module_boundaries.sh

      - name: Rebuild fixed-resource negative controls under ASan and UBSan
        if: runner.os == 'Linux'
        run: |
          python3 tools/check_session_resource_mutations.py --profile SMALL --output "$RUNNER_TEMP/session-resources-small"
          python3 tools/check_session_resource_mutations.py --profile LARGE --output "$RUNNER_TEMP/session-resources-large"

      - name: Preserve fixed-resource mutation evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: session-resource-mutations
          path: |
            ${{ runner.temp }}/session-resources-small/**/*.log
            ${{ runner.temp }}/session-resources-small/results.json
            ${{ runner.temp }}/session-resources-large/**/*.log
            ${{ runner.temp }}/session-resources-large/results.json
          retention-days: 30

  sdk-python:
    name: SDK and Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CMake build
        run: |
          cmake -S . -B build/cmake
          cmake --build build/cmake --parallel 4
          ctest --test-dir build/cmake --output-on-failure

      - name: Verify installed SDK consumers, examples and MIT starters
        run: |
          bash tools/check_module_sdk.sh "$PWD/build/cmake"
          bash tools/check_session_resources_sdk.sh "$PWD/build/cmake"
          bash tools/check_sdk_archive.sh "$PWD/build/cmake"
          python3 tools/check_native_reproducibility.py SMALL

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test unified Python against installed SMALL SDK
        run: |
          python -m pip install cffi setuptools pytest
          bash tools/check_python_binding.sh "$PWD/build/cmake" python small

      - name: Verify LARGE installed SDK and Python wrapper
        run: |
          cmake -S . -B build/cmake-large -DMAELYS_DATALOG_PROFILE_LARGE=ON
          cmake --build build/cmake-large --parallel 4
          ctest --test-dir build/cmake-large --output-on-failure
          bash tools/check_module_sdk.sh "$PWD/build/cmake-large"
          bash tools/check_session_resources_sdk.sh "$PWD/build/cmake-large"
          bash tools/check_sdk_archive.sh "$PWD/build/cmake-large"
          python3 tools/check_native_reproducibility.py LARGE
          bash tools/check_python_binding.sh "$PWD/build/cmake-large" python large

      - name: Compile old and new resource callers and providers independently
        run: |
          bash tools/check_session_resource_history.sh "$PWD/build/cmake" SMALL "$RUNNER_TEMP/resource-matrix-SMALL"
          bash tools/check_session_resource_history.sh "$PWD/build/cmake-large" LARGE "$RUNNER_TEMP/resource-matrix-LARGE"

      - name: Preserve public resource compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-resource-matrix-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/resource-matrix-*/revisions.txt
            ${{ runner.temp }}/resource-matrix-*/*.log
            ${{ runner.temp }}/resource-matrix-*/matrix/commands.json
            ${{ runner.temp }}/resource-matrix-*/matrix/report.json
            ${{ runner.temp }}/resource-matrix-*/matrix/*.log
          retention-days: 30

  # The socle's sanitizers job covers SMALL on Linux; the three other cells
  # (LARGE on Linux, both profiles on macOS) keep the coverage of the
  # previous single job, one per job.
  sanitizers:
    name: Sanitizers (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, profile: LARGE }
          - { os: macos-latest, profile: SMALL }
          - { os: macos-latest, profile: LARGE }
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check all native tests including facade with sanitizers (SMALL)
        if: matrix.profile == 'SMALL'
        run: make -j4 -f Makefile.asan asan

      - name: Check all native tests including facade with sanitizers (LARGE)
        if: matrix.profile == 'LARGE'
        run: make -j4 -f Makefile.asan asan PROFILE=LARGE

  bench:
    name: Single-pass benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check single-pass benchmark
        run: make bench-pipeline

  wasm-tests:
    name: WASM tests (Emscripten ${{ matrix.emsdk }}, SMALL and LARGE)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emsdk: ['3.1.61', '4.0.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ matrix.emsdk }}
      - name: Verify the common API and installed WASM extension SDK in both profiles
        run: |
          for profile in small large; do
            tools/build_javascript_binding.sh wasm "$profile" build/javascript-package
            MAELYS_PROFILE="$profile" MAELYS_JS_RUNTIMES=wasm node --test bindings/javascript/test/contract.mjs
            bash tools/check_wasm_extensions.sh "$profile"
          done
          npm install --prefix build/js-test-deps --ignore-scripts --no-package-lock typescript@5.9.3
          TSC="$PWD/build/js-test-deps/node_modules/.bin/tsc" MAELYS_JS_RUNTIMES=wasm node bindings/javascript/test/package.mjs

  javascript-native:
    name: JavaScript native (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify artifact assembly failure controls
        run: python3 -m unittest discover -s tests/tooling -p 'test_javascript_*.py' -v
      - name: Build and test the installed native SDK consumers
        run: |
          for profile in small large; do
            tools/build_javascript_binding.sh native "$profile" build/javascript-package
            MAELYS_PROFILE="$profile" MAELYS_JS_RUNTIMES=node node --test bindings/javascript/test/contract.mjs
          done
          node bindings/javascript/test/native-workers.mjs
          node --test bindings/javascript/test/native-loading.mjs
      - name: Verify packed CommonJS and ESM consumers and declarations
        run: |
          npm install --prefix build/js-test-deps --ignore-scripts --no-package-lock typescript@5.9.3
          TSC="$PWD/build/js-test-deps/node_modules/.bin/tsc" MAELYS_JS_RUNTIMES=node node bindings/javascript/test/package.mjs
      - name: Exercise malformed transport frames with ASan and UBSan
        if: matrix.node == '22'
        run: |
          tools/check_javascript_transport.sh small
          tools/check_javascript_transport.sh large

  javascript-release:
    name: JavaScript release artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, target: linux-x86_64 }
          - { os: ubuntu-26.04-arm, target: linux-arm64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: ubuntu-26.04, target: wasm32 }
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the exact release packaging path
        # package-release.sh selects its pinned Node and Emscripten itself.
        run: bash scripts/package-release.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-release-${{ matrix.target }}
          path: dist/
          retention-days: 14

  javascript-parity:
    name: JavaScript native, WASM, Python and browser parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.61'
      - name: Build both runtimes and compare identical inputs against Python
        run: |
          python -m pip install cffi setuptools
          for profile in small large; do
            tools/build_javascript_binding.sh native "$profile" build/javascript-package
            tools/build_javascript_binding.sh wasm "$profile" build/javascript-package
            MAELYS_PROFILE="$profile" node --test bindings/javascript/test/contract.mjs
            tools/check_javascript_python.sh "$profile" python
          done
      - name: Verify the real npm archive and browser/module-worker execution
        run: |
          npm install --prefix build/js-test-deps --ignore-scripts --no-package-lock typescript@5.9.3 @playwright/test@1.62.1
          build/js-test-deps/node_modules/.bin/playwright install --with-deps chromium
          TSC="$PWD/build/js-test-deps/node_modules/.bin/tsc" node bindings/javascript/test/package.mjs
          PLAYWRIGHT_MODULE="$PWD/build/js-test-deps/node_modules/@playwright/test/index.mjs" PLAYWRIGHT_CHANNEL=chromium node bindings/javascript/test/browser.mjs

  fuzz-smoke:
    name: Bounded parser fuzz smokes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The libFuzzer smoke runs in the socle's fuzz job above; this job is
      # the AFL++ one, which needs afl++ and a core-pattern change.
      - name: Install AFL++ harness tooling
        run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages: the update reports, the install decides.
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y afl++
      - name: Run existing AFL++ bounded smoke
        run: |
          # This hosted runner is disposable. Let AFL observe crash exits
          # directly, then restore the original core-dump handler on exit.
          afl_previous_core_pattern="$(sysctl -n kernel.core_pattern)"
          trap 'sudo sysctl -w "kernel.core_pattern=$afl_previous_core_pattern" >/dev/null' EXIT
          sudo sysctl -w kernel.core_pattern=core
          make -f Makefile.afl afl-smoke
