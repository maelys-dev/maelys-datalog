name: Benchmark comparison (manual)

on:
  workflow_dispatch:
    inputs:
      base:
        description: Immutable baseline from the archived residual protocol
        required: true
        type: string
      head:
        description: Immutable corrected candidate from the archived residual protocol
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: One bounded sequential placement diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tooling
        run: python3 -m unittest discover -s bench -p 'test_*.py'
      - name: Prepare diagnostic tool
        run: |
          if ! command -v valgrind >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y valgrind
          fi
      - name: Freeze inputs before any build or measurement
        env:
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        run: python3 bench/bounded_residual.py prepare "$RUNNER_TEMP/bounded-residual" --base "$BASE_REF" --head "$HEAD_REF"
      - name: Archive declared protocol before measurement
        uses: actions/upload-artifact@v4
        with:
          name: residual-preregistered-${{ github.run_id }}
          path: ${{ runner.temp }}/bounded-residual/preregistered/
          if-no-files-found: error
          retention-days: 30
      - name: Finish every build and verify symbol displacement
        run: python3 bench/bounded_residual.py build "$RUNNER_TEMP/bounded-residual"
      - name: Archive binary manifest before measurement
        uses: actions/upload-artifact@v4
        with:
          name: residual-binary-manifest-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bounded-residual/binaries/manifest.json
            ${{ runner.temp }}/bounded-residual/build-complete.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain full general solver input and session matrices
        run: python3 bench/bounded_residual.py general "$RUNNER_TEMP/bounded-residual"
      - name: Execute exactly the archived timing schedule
        run: python3 bench/bounded_residual.py timings "$RUNNER_TEMP/bounded-residual"
      - name: Repeat scoped counts in separate processes
        run: python3 bench/bounded_residual.py counts "$RUNNER_TEMP/bounded-residual"
      - name: Report every pass and strict count comparison
        run: python3 bench/bounded_residual.py report "$RUNNER_TEMP/bounded-residual"
      - name: Upload raw evidence including partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-residual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bounded-residual/
            !${{ runner.temp }}/bounded-residual/workspace/
          if-no-files-found: warn
          retention-days: 30
