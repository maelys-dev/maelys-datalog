name: Benchmark comparison (manual)

on:
  workflow_dispatch:
    inputs:
      base:
        description: Baseline branch, tag or commit SHA
        required: true
        type: string
      head:
        description: Candidate branch, tag or commit SHA
        required: true
        type: string
      allocation_counts:
        description: Optional backend allocation and fixed v0.18 lifecycle software counts (no timings)
        required: false
        default: false
        type: boolean
      retained_inputs:
        description: Compare public snapshot, retained replacement and supplied delta instructions on head (no timings)
        required: false
        default: false
        type: boolean
      backend_inputs:
        description: Count public conformance provider with snapshot6, delta6 and delta7 on head (no timings)
        required: false
        default: false
        type: boolean

      window_inputs:
        description: Compare complete window ABI 7 host/provider instructions on base and head (no timings)
        required: false
        default: false
        type: boolean
      diagnostic_original:
        description: Optional original candidate SHA for LARGE Callgrind and layout diagnosis
        required: false
        default: ''
        type: string
      diagnostic_size:
        description: Predeclared solver_size_pure case for the optional diagnostic
        required: false
        default: '2048'
        type: choice
        options: ['1024', '2048']
      session_diagnostics:
        description: Count declared controls and residuals with cache/branch simulation
        required: false
        default: false
        type: boolean
      session_layout:
        description: Diagnose eight declared session fixtures with live data addresses and 0/16-byte text controls
        required: false
        default: false
        type: boolean
      session_layout_original:
        description: Optional original SHA for full three-revision matrices and layout comparison (head is revised)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Sequential A-A and A-B comparison
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check comparison tooling
        run: python3 -m unittest discover -s bench -p 'test_compare*.py'
      - name: Prepare optional diagnostic tool
        if: inputs.diagnostic_original != '' || inputs.session_diagnostics || inputs.session_layout || inputs.retained_inputs || inputs.backend_inputs || inputs.window_inputs || inputs.allocation_counts
        run: |
          if ! command -v valgrind >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y valgrind
          fi
      - name: Check retained-input experiment identity and exclusive selection
        if: inputs.retained_inputs || inputs.backend_inputs || inputs.window_inputs || inputs.allocation_counts
        env:
          HEAD_REF: ${{ inputs.head }}
          BASE_REF: ${{ inputs.base }}
          ALLOCATION_CONFLICT: ${{ inputs.allocation_counts && (inputs.retained_inputs || inputs.backend_inputs || inputs.window_inputs) }}
          OTHER_DIAGNOSTIC: ${{ inputs.diagnostic_original != '' || inputs.session_diagnostics || inputs.session_layout || inputs.session_layout_original != '' }}
          BOTH_INPUT_MODES: ${{ (inputs.retained_inputs && inputs.backend_inputs) || (inputs.window_inputs && (inputs.retained_inputs || inputs.backend_inputs)) }}
        run: |
          test "$ALLOCATION_CONFLICT" = false
          test "$OTHER_DIAGNOSTIC" = false
          test "$BOTH_INPUT_MODES" = false
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$HEAD_REF^{commit}")"
          git rev-parse "$BASE_REF^{commit}"
          git diff --exit-code
      - name: Measure optional backend allocation
        if: inputs.allocation_counts
        env:
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        run: python3 bench/compare_backend_allocation.py "$BASE_REF" "$HEAD_REF" "$RUNNER_TEMP/backend-allocation"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.allocation_counts
        with:
          name: backend-allocation-${{ github.sha }}
          path: ${{ runner.temp }}/backend-allocation
          retention-days: 30
      - name: Measure complete ABI 7 window transactions
        if: inputs.window_inputs
        env:
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        run: python3 bench/compare_window_inputs.py "$BASE_REF" "$HEAD_REF" "$RUNNER_TEMP/window-inputs"
      - name: Measure retained-input software instructions
        if: inputs.retained_inputs
        env:
          BASE_REF: ${{ inputs.base }}
        run: python3 bench/compare_retained_inputs.py "$RUNNER_TEMP/retained-inputs"
      - name: Measure separately negotiated backend input delivery
        if: inputs.backend_inputs
        env:
          BASE_REF: ${{ inputs.base }}
        run: python3 bench/compare_retained_inputs.py "$RUNNER_TEMP/retained-inputs" --backend-delivery
      - name: Build every session layout variant before measurements
        if: inputs.session_layout
        env:
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
          ORIGINAL_REF: ${{ inputs.session_layout_original }}
        run: python3 bench/diagnose_session_layout.py prepare "$BASE_REF" "$HEAD_REF" "$RUNNER_TEMP/session-layout" "$ORIGINAL_REF"
      - name: Diagnose instructions and binary layout
        if: inputs.diagnostic_original != ''
        env:
          BASE_REF: ${{ inputs.base }}
          ORIGINAL_REF: ${{ inputs.diagnostic_original }}
          DIAGNOSTIC_SIZE: ${{ inputs.diagnostic_size || '2048' }}
          HEAD_REF: ${{ inputs.head }}
        run: bash bench/diagnose_solver_layout.sh "$BASE_REF" "$ORIGINAL_REF" "$HEAD_REF" "$RUNNER_TEMP/bench-diagnostic"
      - name: Compare immutable revisions
        if: '!inputs.retained_inputs && !inputs.backend_inputs && !inputs.window_inputs && !inputs.allocation_counts'
        env:
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
          SESSION_DIAGNOSTICS: ${{ inputs.session_diagnostics && '1' || '0' }}
          COMPARISON_ORIGINAL: ${{ inputs.session_layout_original }}
        run: bash bench/compare_revisions.sh "$BASE_REF" "$HEAD_REF" "$RUNNER_TEMP/bench-comparison"
      - name: Measure prepared-session data and code placement
        if: inputs.session_layout
        run: python3 bench/diagnose_session_layout.py run "$RUNNER_TEMP/session-layout"
      - name: Upload measurements and report (including partial failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bench-comparison/
            ${{ runner.temp }}/bench-diagnostic/
            ${{ runner.temp }}/session-layout/
            ${{ runner.temp }}/retained-inputs/
            ${{ runner.temp }}/window-inputs/
          if-no-files-found: warn
          retention-days: 30
