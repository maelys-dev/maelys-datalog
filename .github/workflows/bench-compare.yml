name: Backend ABI 5 instruction proof (manual)
on:
  workflow_dispatch:
    inputs:
      base:
        description: Immutable baseline commit
        required: true
        type: string
      head:
        description: Immutable ABI 5 candidate commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify parser tooling
        run: python3 -m unittest discover -s bench -p test_compare_session_proof.py
      - name: Prepare Callgrind
        run: |
          if ! command -v valgrind >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y valgrind
          fi
      - name: Count all session cases sequentially
        env:
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        run: |
          base=$(git rev-parse "$BASE_REF^{commit}")
          head=$(git rev-parse "$HEAD_REF^{commit}")
          python3 bench/abi5_counts.py "$PWD" "$RUNNER_TEMP/abi5-counts" "$RUNNER_TEMP/abi5-build" "$base" "$head"
      - name: Preserve all raw counts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abi5-counts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abi5-counts
          if-no-files-found: warn
          retention-days: 30
