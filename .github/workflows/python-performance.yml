name: Python performance

# Separate from the native, manual bench-compare.yml. PRs run deterministic
# contracts in CI; trusted main commits produce reports for human release review.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      comparison_base:
        description: 'Optional full SHA for an additional complete comparison (not release evidence)'
        type: string
        default: ''
      prepared_span_counts:
        description: 'Count fixed #145 versus #143 complete requests from run 36566987207'
        type: boolean
        default: false
      span_report_sha256:
        description: 'Verified SHA-256 of the fixed span comparison report'
        type: string
        default: ''
      prepared_diagnostic:
        description: 'Investigate fixed #143 prepared requests with original binaries and software counts'
        type: boolean
        default: false
      tail_diagnostic:
        description: 'Run the fixed SMALL-Release tail investigation (not release evidence)'
        type: boolean
        default: false
      instruction_diagnostic:
        description: 'Count fixed transactions using the original hosted SDK binaries'
        type: boolean
        default: false

      release_diagnostic:
        description: 'Count the fixed v0.13 release observations using original SDK binaries'
        type: boolean
        default: false

      release_process_control:
        description: 'Counterbalance original v0.13 binaries with an identical-binary label'
        type: boolean
        default: false

      allocator_diagnostic:
        description: 'Replay original #142 binaries with default and fixed glibc allocator policy'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: python-performance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Python performance evidence
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.prepared_diagnostic == true && 90 || 60 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Reject ambiguous span count selection
        if: (inputs.prepared_span_counts == true && (inputs.prepared_diagnostic == true || inputs.comparison_base != '' || inputs.allocator_diagnostic == true || inputs.tail_diagnostic == true || inputs.instruction_diagnostic == true || inputs.release_diagnostic == true || inputs.release_process_control == true)) || (inputs.prepared_span_counts != true && inputs.span_report_sha256 != '')
        run: exit 1
      - name: Install fixed measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake
          python -m pip install -r bench/python-perf-requirements.txt
      - name: Measure candidate, previous release and durable v0.11.1 reference
        if: inputs.prepared_span_counts != true && inputs.prepared_diagnostic != true && inputs.allocator_diagnostic != true && inputs.tail_diagnostic != true && inputs.instruction_diagnostic != true && inputs.release_diagnostic != true && inputs.release_process_control != true
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARISON_BASE: ${{ inputs.comparison_base }}
        run: |
          # Schema 4 includes independent same-binary null controls for both
          # references, plus the fixed three-request positive control.
          base="$(python tools/check_python_performance.py previous-release)"
          extra=()
          if test -n "$COMPARISON_BASE"; then
            [[ "$COMPARISON_BASE" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test "$(git rev-parse "$COMPARISON_BASE^{commit}")" = "$COMPARISON_BASE"
            base="$COMPARISON_BASE"
            extra=(--comparison-only)
          fi
          test -z "${MALLOC_TRIM_THRESHOLD_:-}${MALLOC_TOP_PAD_:-}${GLIBC_TUNABLES:-}${LD_PRELOAD:-}"
          set +e
          python bench/python_perf.py --base "$base" --compiler clang-18 --output evidence "${extra[@]}"
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo '::warning::Python timing observations require human review before cut --apply. Record the report and decision in the changelog PR; this job is not performance approval.' ;;
            *) exit "$status" ;;
          esac
      - name: Diagnose the fixed Python tail observation
        if: inputs.prepared_span_counts != true && inputs.prepared_diagnostic != true && inputs.allocator_diagnostic != true && inputs.tail_diagnostic == true && inputs.instruction_diagnostic != true && inputs.release_diagnostic != true && inputs.release_process_control != true
        run: |
          python -m unittest discover -s tests/tooling -p 'test_python_perf*.py' -v
          python bench/python_tail_diagnostic.py --compiler clang-18 --output evidence
      - name: Count original Python request instructions
        if: inputs.prepared_span_counts != true && inputs.prepared_diagnostic != true && inputs.allocator_diagnostic != true && inputs.instruction_diagnostic == true && inputs.tail_diagnostic != true && inputs.release_diagnostic != true && inputs.release_process_control != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y valgrind
          gh run download 36308020794 --name python-performance-f975be6a8e6778d320f48becce5d9e29c0573f6b --dir original-evidence
          python -m unittest discover -s tests/tooling -p 'test_python_perf*.py' -v
          python bench/python_tail_instructions.py --evidence original-evidence --output evidence
      - name: Count v0.13 release request instructions
        if: inputs.prepared_span_counts != true && inputs.prepared_diagnostic != true && inputs.allocator_diagnostic != true && inputs.release_diagnostic == true && inputs.tail_diagnostic != true && inputs.instruction_diagnostic != true && inputs.release_process_control != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y valgrind
          gh run download 36331650860 --name python-performance-21ca6813936590410d3d774de078cd158d976fd5 --dir original-evidence
          python -m unittest discover -s tests/tooling -p 'test_python_perf*.py' -v
          python bench/python_release_instructions.py --evidence original-evidence --output evidence
      - name: Counterbalance original v0.13 binaries and process labels
        if: inputs.prepared_span_counts != true && inputs.prepared_diagnostic != true && inputs.allocator_diagnostic != true && inputs.release_process_control == true && inputs.release_diagnostic != true && inputs.tail_diagnostic != true && inputs.instruction_diagnostic != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36331650860 --name python-performance-21ca6813936590410d3d774de078cd158d976fd5 --dir original-evidence
          python -m unittest discover -s tests/tooling -p 'test_python_perf*.py' -v
          python bench/python_release_controls.py --evidence original-evidence --output evidence
      - name: Compare allocator policy on original Python request binaries
        if: inputs.prepared_span_counts != true && inputs.prepared_diagnostic != true && inputs.allocator_diagnostic == true && inputs.tail_diagnostic != true && inputs.instruction_diagnostic != true && inputs.release_diagnostic != true && inputs.release_process_control != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y strace
          gh run download 36504178509 --name python-performance-f2372725bd077cd9211dc2f9f2a4eb77334061a1 --dir original-evidence
          python -m unittest discover -s tests/tooling -p 'test_python_perf*.py' -v
          python bench/python_allocator_control.py --evidence original-evidence --output evidence
      - name: Investigate the fixed prepared-request observations
        if: inputs.prepared_span_counts != true && inputs.prepared_diagnostic == true && inputs.comparison_base == '' && inputs.allocator_diagnostic != true && inputs.tail_diagnostic != true && inputs.instruction_diagnostic != true && inputs.release_diagnostic != true && inputs.release_process_control != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y valgrind
          gh run download 36545968747 --name python-performance-646ac3d76916bc20a990bf08deea37fea4c56fde --dir original-release
          gh run download 36545921158 --name python-performance-646ac3d76916bc20a990bf08deea37fea4c56fde --dir original-parent
          python -m unittest discover -s tests/tooling -p 'test_python_perf*.py' -v
          python bench/python_prepared_diagnostic.py --release-evidence original-release --parent-evidence original-parent --output evidence
      - name: Reject ambiguous prepared diagnostic selection
        if: inputs.prepared_span_counts != true && inputs.prepared_diagnostic == true && (inputs.comparison_base != '' || inputs.allocator_diagnostic == true || inputs.tail_diagnostic == true || inputs.instruction_diagnostic == true || inputs.release_diagnostic == true || inputs.release_process_control == true)
        run: exit 1
      - name: Reject ambiguous allocator diagnostic selection
        if: inputs.prepared_span_counts != true && inputs.allocator_diagnostic == true && (inputs.tail_diagnostic == true || inputs.instruction_diagnostic == true || inputs.release_diagnostic == true || inputs.release_process_control == true)
        run: exit 1
      - name: Reject an extra baseline with a scoped diagnostic
        if: inputs.prepared_span_counts != true && inputs.comparison_base != '' && (inputs.allocator_diagnostic == true || inputs.tail_diagnostic == true || inputs.instruction_diagnostic == true || inputs.release_diagnostic == true || inputs.release_process_control == true)
        run: exit 1
      - name: Reject ambiguous diagnostic selection
        if: (inputs.instruction_diagnostic == true && inputs.tail_diagnostic == true) || (inputs.release_diagnostic == true && (inputs.instruction_diagnostic == true || inputs.tail_diagnostic == true)) || (inputs.release_process_control == true && (inputs.release_diagnostic == true || inputs.instruction_diagnostic == true || inputs.tail_diagnostic == true))
        run: exit 1
      - name: Count the fixed prepared IDB span comparison
        if: inputs.prepared_span_counts == true && inputs.prepared_diagnostic != true && inputs.comparison_base == '' && inputs.allocator_diagnostic != true && inputs.tail_diagnostic != true && inputs.instruction_diagnostic != true && inputs.release_diagnostic != true && inputs.release_process_control != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA256: ${{ inputs.span_report_sha256 }}
        run: |
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          sudo apt-get install -y valgrind
          gh run download 36566987207 --name python-performance-adf2cf3d112efc95fbb9be0a5386346d630fb0bc --dir span-evidence
          python -m unittest discover -s tests/tooling -p 'test_python_perf*.py' -v
          python bench/python_prepared_diagnostic.py --span-evidence span-evidence --report-sha256 "$REPORT_SHA256" --output evidence
      - name: Preserve every measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.prepared_span_counts == true && 'python-prepared-span-counts' || inputs.prepared_diagnostic == true && 'python-prepared-diagnostic' || inputs.allocator_diagnostic == true && 'python-allocator-control' || inputs.release_process_control == true && 'python-release-process-control' || inputs.release_diagnostic == true && 'python-release-instructions' || inputs.instruction_diagnostic == true && 'python-tail-instructions' || inputs.tail_diagnostic == true && 'python-tail-diagnostic' || 'python-performance' }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Report
        if: always()
        run: |
          if test -f evidence/report.md; then cat evidence/report.md >> "$GITHUB_STEP_SUMMARY"; fi
