name: release

# Managed by maelys-release v0.62.2 (0.62.2). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@5148671abf3a1b437025881d10fd768efb9de5b3 # v0.62.2
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-datalog
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      verify_command: bash scripts/verify-release.sh TARGET
      linux_packages: build-essential dpkg-dev file rpm clang jq cmake python3 binutils curl
      macos_packages: cmake python@3.12
      targets: '[{"target": "linux-x86_64"}, {"target": "linux-arm64"}, {"target": "macos-arm64"}, {"target": "wasm32", "runner": "ubuntu-26.04"}]'
      manifest_patterns: '*.tar.gz *.deb *.rpm release-receipt-*.json'

  channel-npm-javascript:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/channel.yml@5148671abf3a1b437025881d10fd768efb9de5b3 # v0.62.2
    permissions:
      contents: write
      packages: write
    with:
      product: maelys-datalog
      tag: ${{ inputs.tag || github.ref_name }}
      channel: npm-javascript
      publish_command: bash scripts/publish-channel.sh TAG CHANNEL
      release_environment: ''
