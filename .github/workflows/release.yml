name: release

# Managed by maelys-release v0.49.1 (0.49.1). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@3162ac84853cd768e5f2ec724916955583a235c9 # v0.49.1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-datalog
      tag: ${{ inputs.tag || github.ref_name }}
      verify_command: bash scripts/verify-release.sh TARGET
      linux_packages: build-essential dpkg-dev file rpm clang jq
      targets: '[{"target": "linux-x86_64"}, {"target": "linux-arm64"}, {"target": "macos-arm64"}, {"target": "wasm32", "runner": "ubuntu-26.04"}]'
      manifest_patterns: '*.tar.gz *.deb *.rpm release-receipt-*.json'

  channel-npm:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/channel.yml@3162ac84853cd768e5f2ec724916955583a235c9 # v0.49.1
    permissions:
      contents: write
      packages: write
    with:
      product: maelys-datalog
      tag: ${{ inputs.tag || github.ref_name }}
      channel: npm
      publish_command: bash scripts/publish-channel.sh TAG CHANNEL
